Section "Monitor"
    Identifier "CNCDisplay"
    Option "PreferredMode" "1024x600"
    Modeline "1024x600" 51.20 1024 1072 1168 1344 600 611 621 635 -HSync +VSync
EndSection

Section "Device"
    Identifier "CNCGraphics"
    Driver "modesetting"
    Option "Monitor-HDMI-2" "CNCDisplay"
    # Never scan out a client buffer directly. The kiosk window is one pixel
    # wider than the screen (see chromium-autostart.sh), so its buffer has a
    # 4100-byte pitch that is not 64-byte aligned; the vc4 HVS mis-fetches such
    # a buffer and the panel shows a diagonally sheared image. With page
    # flipping off, Xorg always composites into its own screen pixmap
    # (1024x600, pitch 4096) and only that aligned buffer reaches the display.
    # Reproducer for the bug: close a native <select> dropdown - while the
    # popup is open the main window is occluded and Xorg composites (correct
    # image); on close it would flip back to the misaligned client buffer.
    Option "PageFlip" "false"
EndSection

Section "Screen"
    Identifier "CNCScreen"
    Device "CNCGraphics"
    Monitor "CNCDisplay"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1024x600"
    EndSubSection
EndSection
