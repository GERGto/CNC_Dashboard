Section "Monitor"
    Identifier "CNCDisplay"
    Option "PreferredMode" "1024x600"
    Modeline "1024x600" 49.00 1024 1072 1168 1312 600 603 613 624 -HSync +VSync
EndSection

Section "Device"
    Identifier "CNCGraphics"
    Driver "modesetting"
    Option "Monitor-HDMI-2" "CNCDisplay"
EndSection

Section "Screen"
    Identifier "CNCScreen"
    Device "CNCGraphics"
    Monitor "CNCDisplay"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1024x600"
    EndSubSection
EndSection
