# BEGIN CNC DASHBOARD
[global]
    netbios name = CNCPI
    server string = CNC Dashboard
    # DDCS V4.1 requires the legacy NT1 dialect for its Net Disk client.
    server min protocol = NT1
    ntlm auth = yes
    map to guest = Bad User

[share]
    comment = DDCS V4.1 Net Disk
    path = /var/lib/cnc-dashboard/programs
    browseable = yes
    read only = no
    guest ok = yes
    guest only = yes
    force user = dietpi
    force group = dietpi
    create mask = 0660
    force create mode = 0660
    directory mask = 0770
    force directory mode = 0770
    follow symlinks = no
    wide links = no
    hosts allow = 127.0.0.1 192.168.2.5
    hosts deny = 0.0.0.0/0

[cnc-programs]
    comment = CNC Dashboard Programmdateien
    path = /var/lib/cnc-dashboard/programs
    browseable = yes
    read only = no
    guest ok = no
    valid users = dietpi
    force user = dietpi
    force group = dietpi
    create mask = 0660
    force create mode = 0660
    directory mask = 0770
    force directory mode = 0770
    follow symlinks = no
    wide links = no
# END CNC DASHBOARD
